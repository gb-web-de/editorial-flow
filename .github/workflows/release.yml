name: Release

# Push a tag to release:
#
#   git tag v1.2.0 && git push origin v1.2.0
#
# The whole CI suite runs first - unit, functional, JavaScript, browser and the
# four installation scenarios - and only a green run gets a GitHub release with
# an installable zip. A tag with a suffix (v1.2.0-rc.1) becomes a pre-release.
# Packagist picks the tag up by itself once the repository is registered there.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read the version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Tag \"$GITHUB_REF_NAME\" is not vMAJOR.MINOR.PATCH[-suffix]." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT"
          fi

      # git archive honours .gitattributes, so the zip holds what an
      # installation needs and none of the test and tooling files.
      - name: Build the extension zip
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=editorial_flow/ \
            -o "dist/editorial_flow_${{ steps.version.outputs.version }}.zip" HEAD
          unzip -l "dist/editorial_flow_${{ steps.version.outputs.version }}.zip" > dist/contents.txt
          grep -q "editorial_flow/composer.json" dist/contents.txt
          grep -q "editorial_flow/Classes/Command/SetupCommand.php" dist/contents.txt
          if grep -q "editorial_flow/Tests/" dist/contents.txt; then
            echo "Tests/ ended up in the release zip - check .gitattributes." >&2
            exit 1
          fi

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/editorial_flow_${{ steps.version.outputs.version }}.zip" \
            --title "Editorial Flow ${{ steps.version.outputs.version }}" \
            --generate-notes --verify-tag ${{ steps.version.outputs.prerelease }}
