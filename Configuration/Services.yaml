services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  GbWeb\EditorialFlow\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Domain/Model/*'
      # Registered from Services.php instead, and only when EXT:reactions is
      # installed: TaskReaction implements an interface from that package, and
      # autowiring it here would make the container build fail on an
      # installation that does not have it.
      - '../Classes/Reaction/*'

  # Listed explicitly so constructor changes in these entry-point classes are
  # reflected in TYPO3's compiled container as soon as Services.yaml changes.
  GbWeb\EditorialFlow\Controller\EditorialFlowController:
    public: true

  GbWeb\EditorialFlow\Controller\TaskAjaxController:
    public: true

  GbWeb\EditorialFlow\EventListener\PageModuleEventListener:
    public: true

  GbWeb\EditorialFlow\Hooks\TaskAutoCreationDataHandlerHook:
    public: true

  GbWeb\EditorialFlow\Updates\MigrateExistingWorkspaceChangesToTasksUpdate:
    public: true

  GbWeb\EditorialFlow\Updates\MigrateLegacyContentFlowTablesUpdate:
    public: true

  GbWeb\EditorialFlow\Dashboard\Widget\TaskOverviewWidget:
    tags:
      - name: dashboard.widget
        identifier: editorialFlowTaskOverview
        groupNames: 'editorialFlow'
        title: 'Editorial Flow: Task overview'
        description: 'How much work sits in each state, and what nobody has taken yet'
        iconIdentifier: content-widget-chart-bar
        height: 'medium'
        width: 'medium'

  GbWeb\EditorialFlow\Dashboard\Widget\MyTasksWidget:
    tags:
      - name: dashboard.widget
        identifier: editorialFlowMyTasks
        groupNames: 'editorialFlow'
        title: 'Editorial Flow: My tasks'
        description: 'Tasks assigned to you'
        iconIdentifier: status-user-backend
        height: 'medium'
        width: 'medium'

  GbWeb\EditorialFlow\Dashboard\Widget\RecentActivityWidget:
    tags:
      - name: dashboard.widget
        identifier: editorialFlowRecentActivity
        groupNames: 'editorialFlow'
        title: 'Editorial Flow: Recent activity'
        description: 'Latest editorial decisions across the board'
        iconIdentifier: actions-history
        height: 'medium'
        width: 'medium'

  # The one widget xima/xima-typo3-content-planner has that the three above did
  # not cover - a feed to catch up on discussion. See RecentCommentsWidget's
  # docblock for why the other two xima widgets were not copied.
  GbWeb\EditorialFlow\Dashboard\Widget\RecentCommentsWidget:
    tags:
      - name: dashboard.widget
        identifier: editorialFlowRecentComments
        groupNames: 'editorialFlow'
        title: 'Editorial Flow: Recent comments'
        description: 'Catch up on discussion across the board'
        iconIdentifier: actions-message
        height: 'medium'
        width: 'medium'
